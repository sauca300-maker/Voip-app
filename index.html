<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0F1E2E">

<title>VoIP Pro App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

html, body {
  margin:0;
  height:100%;
  font-family:Arial;
  overflow:hidden;
}

/* 🌊 fundo */
.bg {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

.overlay {
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(135deg, rgba(0,70,140,0.5), rgba(0,10,40,0.9));
  z-index:-1;
}

/* 🔐 LOGIN MELHORADO */
.login {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card {
  width:90%;
  max-width:360px;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  text-align:center;
  color:white;
}

input {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.3);

  background:rgba(0,0,0,0.2);
  color:white;
  font-size:15px;
}

input::placeholder {
  color:#ffffff;
  opacity:0.9;
}

button.login-btn {
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
  color:white;
  font-weight:bold;
}

/* 📱 APP */
.app {
  display:none;
  height:100vh;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  color:white;
}

/* perfil */
.profile {
  width:110px;
  height:110px;
  border-radius:50%;
  border:3px solid white;
}

/* status animado */
.status {
  color:#dbefff;
  font-size:18px;
}

/* animação texto chamando */
.typing::after {
  content:" .";
  animation:dots 1s infinite;
}

@keyframes dots {
  0% {content:" .";}
  33% {content:" ..";}
  66% {content:" ...";}
}

/* botões */
.controls {
  display:flex;
  gap:15px;
}

.btn-circle {
  width:70px;
  height:70px;
  border-radius:50%;
  border:none;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.call { background:#00c853; color:white; }
.msg { background:#ffb300; color:black; }
.end { background:#ff1744; color:white; }

/* 🔥 pulsar chamada */
.calling {
  animation:pulse 0.6s infinite;
}

@keyframes pulse {
  0% { box-shadow:0 0 0 0 rgba(0,200,83,0.7); }
  100% { box-shadow:0 0 25px 15px rgba(0,200,83,0); }
}

</style>
</head>

<body>

<img class="bg" src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21">
<div class="overlay"></div>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <div class="card">
    <h3>Entrar no VoIP</h3>

    <input id="name" placeholder="Digite o seu nome">
    <input id="id" placeholder="Digite o seu ID">

    <button class="login-btn" onclick="enterApp()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="appBox">

<img class="profile" src="https://randomuser.me/api/portraits/women/44.jpg">

<div class="status" id="status">Online</div>

<div class="controls">

<button class="btn-circle call" onclick="startCall()">
<i class="bi bi-telephone-fill"></i>
</button>

<button class="btn-circle msg" onclick="openMsg()">
<i class="bi bi-chat-dots-fill"></i>
</button>

<button class="btn-circle end" onclick="endCall()">
<i class="bi bi-telephone-x-fill"></i>
</button>

</div>

</div>

<!-- 🔊 SOMS -->
<audio id="ring" loop>
<source src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3">
</audio>

<audio id="click">
<source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3">
</audio>

<script>

let myId = "";
let callId = null;
let status = document.getElementById("status");

/* LOGIN */
function enterApp(){

  let name = document.getElementById("name").value;
  let id = document.getElementById("id").value;

  if(!name || !id) return;

  myId = id;

  localStorage.setItem("name", name);
  localStorage.setItem("id", id);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("appBox").style.display = "flex";
}

/* LIGAR */
function startCall(){

  document.getElementById("click").play();

  status.innerText = "Chamando";
  status.classList.add("typing");

  let ring = document.getElementById("ring");
  ring.currentTime = 0;
  ring.play();

  document.querySelector(".call").classList.add("calling");
}

/* TERMINAR */
function endCall(){

  status.innerText = "Terminado";
  status.classList.remove("typing");

  document.getElementById("ring").pause();
  document.querySelector(".call").classList.remove("calling");
}

/* MENSAGEM */
function openMsg(){
  window.location.href = "https://teu-link-aqui.com";
}

</script>

</body>
</html>
